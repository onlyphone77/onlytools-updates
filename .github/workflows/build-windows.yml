name: Installateur Windows
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag de la release à compléter (ex. v0.6.0)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PYVER: "3.12.10"
    steps:
      - uses: actions/checkout@v4
      - name: Python embarqué + bibliothèques
        shell: pwsh
        run: |
          $b = "build\OnlyTools"; New-Item -ItemType Directory -Force "$b\python","$b\tools" | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYVER/python-$env:PYVER-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip "$b\python"
          $pth = Get-ChildItem "$b\python\python*._pth" | Select-Object -First 1
          (Get-Content $pth) -replace '^#import site','import site' | Set-Content $pth
          Add-Content $pth ".."
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          & "$b\python\python.exe" get-pip.py --no-warn-script-location
          & "$b\python\python.exe" -m pip install --no-warn-script-location -r requirements.txt
          Copy-Item -Recurse onlyphone "$b\onlyphone"
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip "$b\tools"
          $v = (Select-String -Path onlyphone\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
      - name: Vérification (le logiciel démarre sous Windows)
        shell: pwsh
        run: |
          $py = "build\OnlyTools\python\python.exe"
          & $py -c "import onlyphone.server, onlyphone.desktop, onlyphone.updater, webview, pymobiledevice3, cryptography; print('imports ok')"
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process $py -ArgumentList "-m onlyphone --no-browser --port 8799" -WorkingDirectory "build\OnlyTools" -PassThru
          Start-Sleep 12
          $r = Invoke-WebRequest http://127.0.0.1:8799/api/status -UseBasicParsing
          Write-Host $r.Content.Substring(0, [Math]::Min(200, $r.Content.Length))
          Stop-Process $p
          if ($r.StatusCode -ne 200) { exit 1 }
      - name: Compilation de l'installateur
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging\windows\ci\installer.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: OnlyTools-Setup
          path: dist/OnlyTools-Setup.exe
      - name: Ajout à la release
        if: ${{ inputs.release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" dist/OnlyTools-Setup.exe --clobber --repo ${{ github.repository }}
